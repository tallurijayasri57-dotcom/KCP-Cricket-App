<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuous Image Flip Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #ffffff 50%, #1b3058 50%);
            margin: 0;
            font-family: sans-serif;
        }

        .flip-container {
            perspective: 1000px;
            width: 210px;
            height: 270px;
        }

        .flipper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            /* 6 seconds for a full cycle (front -> back -> front) */
            animation: flipAnimation 6s infinite ease-in-out;
        }

        /* 
           0-25%: Stay on Front (Founder)
           45-75%: Stay on Back (Logo)
           95-100%: Flip back to Front
        */
        @keyframes flipAnimation {

            0%,
            25% {
                transform: rotateY(0deg);
            }

            45%,
            75% {
                transform: rotateY(180deg);
            }

            95%,
            100% {
                transform: rotateY(360deg);
            }
        }

        .front,
        .back {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            backface-visibility: hidden;
            /* Hides the backside of the panel */
            border-radius: 50%;
            /* Circle shape like your splash screen */
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            /* Nice shadow */
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid #fff;
            box-sizing: border-box;
        }

        .front {
            transform: rotateY(0deg);
        }

        .back {
            transform: rotateY(180deg);
        }

        .front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top; /* Ensures the head is prioritized */
        }

        .logo-wrapper {
            width: 100%;
            height: 100%;
            background-color: #fff; /* Entire oval will be white */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .back img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 20px;
            box-sizing: border-box;
            /* Convert image to pure black text on pure white background */
            filter: grayscale(100%) brightness(140%) contrast(1000%);
        }

        /* Overlay that tints the black text to blue but leaves white as white */
        .color-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #1b3058;
            mix-blend-mode: screen;
            pointer-events: none;
        }

        /* Optional helper text to explain what's happening */
        .info-text {
            position: absolute;
            bottom: 50px;
            color: #a0aec0;
            font-size: 18px;
            letter-spacing: 1px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="flip-container">
        <div class="flipper">
            <!-- Front Face: Founder Picture -->
            <div class="front">
                <img src="images/founder.png" alt="Founder Image">
            </div>
            <!-- Back Face: 2nd Picture (KCP Logo) -->
            <div class="back">
                <div class="logo-wrapper">
                    <img src="images/kcp.jpg" alt="Second Image">
                    <div class="color-overlay"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="info-text">Flipping Animation Demo</div>

</body>

</html>
