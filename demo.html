<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Umpire Signals</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: white;
      overflow: hidden;
    }

    .controls {
      position: absolute;
      bottom: 40px;
      display: flex;
      gap: 15px;
      z-index: 100;
    }

    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 18px;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .btn.btn-four { border-color: #3b82f6; color: #60a5fa; }
    .btn.btn-four:hover { background: #3b82f6; color: white; box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
    
    .btn.btn-six { border-color: #10b981; color: #34d399; }
    .btn.btn-six:hover { background: #10b981; color: white; box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
    
    .btn.btn-out { border-color: #ef4444; color: #f87171; }
    .btn.btn-out:hover { background: #ef4444; color: white; box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }

    .btn.btn-wide { border-color: #f59e0b; color: #fbbf24; }
    .btn.btn-wide:hover { background: #f59e0b; color: white; box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); }

    .btn.btn-noball { border-color: #a855f7; color: #c084fc; }
    .btn.btn-noball:hover { background: #a855f7; color: white; box-shadow: 0 0 20px rgba(168, 85, 247, 0.5); }

    /* Overlay Container */
    .signal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 50;
    }

    .signal-overlay.active {
      opacity: 1;
    }

    /* Umpire SVG */
    .umpire-container {
      width: 250px;
      height: 350px;
      position: relative;
      transform: translateY(50px);
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .signal-overlay.active .umpire-container {
      transform: translateY(0);
    }

    .umpire-part {
      transition: all 0.3s ease;
    }

    /* SVG Default Hiding */
    #arm-right-six, #arm-left-six, 
    #arm-right-out, #arm-right-four,
    #arm-right-wide, #arm-left-wide,
    #arm-right-noball {
      opacity: 0;
    }

    /* Text Animation */
    .signal-text-wrapper {
      position: absolute;
      top: 15%;
      text-align: center;
      perspective: 1000px;
    }

    .signal-text {
      font-size: 120px;
      font-weight: 900;
      line-height: 1;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 4px;
      opacity: 0;
      transform: rotateX(-90deg) scale(0.5);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .signal-overlay.active .signal-text {
      opacity: 1;
      transform: rotateX(0deg) scale(1);
    }

    .theme-four .signal-text { color: #60a5fa; text-shadow: 0 0 40px rgba(59, 130, 246, 0.8); }
    .theme-six .signal-text { color: #34d399; text-shadow: 0 0 40px rgba(16, 185, 129, 0.8); }
    .theme-out .signal-text { color: #f87171; text-shadow: 0 0 40px rgba(239, 68, 68, 0.8); }
    .theme-wide .signal-text { color: #fbbf24; text-shadow: 0 0 40px rgba(245, 158, 11, 0.8); }
    .theme-noball .signal-text { color: #c084fc; text-shadow: 0 0 40px rgba(168, 85, 247, 0.8); }

    /* Ticker */
    .ticker-wrapper {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      max-width: 90vw;
      height: 36px;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      overflow: hidden;
      z-index: 200;
    }
    .ticker-text {
      white-space: nowrap;
      color: rgba(255, 255, 255, 0.9);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 3px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      animation: tickerScroll 25s linear infinite;
    }
    @keyframes tickerScroll {
      from { transform: translateX(500px); }
      to { transform: translateX(-100%); }
    }

    /* Particles & Celebrations */
    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    /* Siren Flash for Wicket */
    @keyframes sirenFlash {
      0%, 100% { background: rgba(2, 6, 23, 0.85); }
      50% { background: rgba(239, 68, 68, 0.3); }
    }
    .signal-overlay.theme-out {
      animation: sirenFlash 0.6s infinite;
    }

    /* Keyframes for Four Waving (Horizontal Sweep across front) */
    @keyframes waveFour {
      0% { transform: scaleX(1); }
      50% { transform: scaleX(-0.6); }
      100% { transform: scaleX(1); }
    }
    
    .anim-four #arm-right-four {
      animation: waveFour 1s infinite ease-in-out;
      transform-origin: 75px 130px;
    }

    /* Keyframes for Out Finger */
    @keyframes fingerUp {
      0% { transform: translateY(20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .anim-out #arm-right-out {
      animation: fingerUp 0.3s ease-out forwards;
    }

    /* Keyframes for Six Arms */
    @keyframes armsUp {
      0% { transform: translateY(20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .anim-six #arm-right-six,
    .anim-six #arm-left-six {
      animation: armsUp 0.3s ease-out forwards;
    }

    /* Keyframes for Wide Arms */
    @keyframes armsSide {
      0% { transform: scaleX(0.5); opacity: 0; }
      100% { transform: scaleX(1); opacity: 1; }
    }
    .anim-wide #arm-right-wide {
      animation: armsSide 0.3s ease-out forwards;
      transform-origin: 75px 130px;
    }
    .anim-wide #arm-left-wide {
      animation: armsSide 0.3s ease-out forwards;
      transform-origin: 125px 130px;
    }

    /* Keyframes for No Ball Arm */
    .anim-noball #arm-right-noball {
      animation: armsSide 0.3s ease-out forwards;
      transform-origin: 75px 130px;
    }

    /* Stadium Lights Background */
    .stadium-bg {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% -20%, #1e293b 0%, #0f172a 80%);
      z-index: -2;
    }
    .light-beam {
      position: absolute;
      top: -10%; left: 30%;
      width: 40%; height: 120%;
      background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
      transform: rotate(-15deg);
      pointer-events: none;
    }
    .light-beam:nth-child(2) {
      left: 50%; transform: rotate(15deg);
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="stadium-bg">
    <div class="light-beam"></div>
    <div class="light-beam"></div>
  </div>

  <h1 style="color:rgba(255,255,255,0.5); font-weight:900; letter-spacing:2px; z-index:10;">MATCH IN PROGRESS</h1>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-four" onclick="showSignal('four')">Signal 4</button>
    <button class="btn btn-six" onclick="showSignal('six')">Signal 6</button>

  <!-- The Animated Overlay -->
  <div class="signal-overlay" id="signalOverlay">
    <div class="particles" id="particles"></div>
    
    <div class="signal-text-wrapper" id="textWrapper">
      <div class="signal-text" id="signalText">FOUR</div>
    </div>

    <!-- Professional SVG Umpire -->
    <div class="umpire-container" id="umpireContainer">
      <svg viewBox="0 0 200 300" width="100%" height="100%">

        <defs>

        <!-- Belt -->

        <!-- Belt Buckle (Gold) -->
        <rect x="92" y="187" width="16" height="10" fill="#fbbf24" rx="2"/>

        <!-- Shirt details (Collar/buttons) -->
        <path d="M 88 125 L 100 140 L 112 125" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
        
        <!-- Lanyard and ID Card -->
        <path d="M 92 125 L 100 165 L 108 125" fill="none" stroke="#2563eb" stroke-width="2"/>
        <rect x="95" y="165" width="10" height="14" fill="#ffffff" stroke="#cbd5e1" rx="1"/>
        <rect x="97" y="167" width="6" height="6" fill="#94a3b8"/> <!-- photo placeholder -->

        <!-- Head & Face -->
        <!-- Ears -->
        <circle cx="75" cy="95" r="6" fill="url(#skinGrad)"/>
        <circle cx="125" cy="95" r="6" fill="url(#skinGrad)"/>
        
        <!-- Face Base -->
        <circle cx="100" cy="95" r="22" fill="url(#skinGrad)"/>
        
        <!-- Stylish Beard / Stubble -->
        <path d="M 84 104 Q 100 120 116 104 Q 100 114 84 104 Z" fill="#334155" opacity="0.8"/>
        
        <!-- Sunglasses (Professional) -->
        <rect x="81" y="86" width="16" height="12" rx="3" fill="url(#glassGrad)"/>
        <rect x="103" y="86" width="16" height="12" rx="3" fill="url(#glassGrad)"/>
        <!-- Glasses Bridge -->
        <path d="M 97 90 Q 100 88 103 90" fill="none" stroke="#0f172a" stroke-width="2"/>
        <!-- Glasses Highlights -->
        <path d="M 84 89 L 91 89" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
        <path d="M 106 89 L 113 89" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
        
        <!-- Nose -->
        <path d="M 100 95 L 98 102 L 102 102" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Slight Smile inside beard -->
        <path d="M 94 107 Q 100 110 106 107" fill="none" stroke="#020617" stroke-width="1.5" stroke-linecap="round"/>

        <!-- Hat (Stylish Fedora style) -->
        <!-- Brim -->
        <ellipse cx="100" cy="72" rx="38" ry="8" fill="#0f172a" filter="url(#shadow)"/>
        <!-- Crown -->
        <path d="M 78 72 L 82 40 Q 100 35 118 40 L 122 72 Z" fill="url(#pantsGrad)"/>
        <!-- Hat Ribbon -->
        <path d="M 79 64 L 121 64 L 122 72 Q 100 76 78 72 Z" fill="#3b82f6"/> 
        <path d="M 79 64 L 121 64" fill="none" stroke="#60a5fa" stroke-width="1"/>

        <!-- === IDLE ARMS === -->
        <g id="arm-right-idle" class="umpire-part">
          <!-- Shoulder joint to hide gaps -->
          <circle cx="75" cy="130" r="8" fill="url(#shirtGrad)"/>
          <path d="M 78 128 L 50 165 L 62 170 L 85 135 Z" fill="url(#shirtGrad)" filter="url(#shadow)"/>
          <!-- Watch -->
          <rect x="52" y="162" width="12" height="4" fill="#0f172a" transform="rotate(-30 58 164)"/>
          <circle cx="56" cy="170" r="9" fill="url(#skinGrad)"/>
        </g>
        <g id="arm-left-idle" class="umpire-part">
          <circle cx="125" cy="130" r="8" fill="url(#shirtGrad)"/>
          <path d="M 122 128 L 150 165 L 138 170 L 115 135 Z" fill="url(#shirtGrad)" filter="url(#shadow)"/>
          <circle cx="144" cy="170" r="9" fill="url(#skinGrad)"/>
        </g>

        <!-- === FOUR ARM (Waving horizontal across front) === -->
        <g id="arm-right-four" class="umpire-part">
          <circle cx="75" cy="130" r="8" fill="#e2e8f0"/>
          <path d="M 75 125 L 125 135 L 125 145 L 75 140 Z" fill="url(#shirtGrad)" filter="url(#shadow)"/>
          <rect x="115" y="133" width="6" height="12" fill="#0f172a"/> <!-- Watch -->
          <circle cx="128" cy="140" r="9" fill="url(#skinGrad)"/>

        <!-- === SIX ARMS (Both Up) === -->
        <g id="arm-right-six" class="umpire-part">
          <circle cx="75" cy="130" r="8" fill="url(#shirtGrad)"/>

          <rect x="64" y="65" width="19" height="5" fill="#0f172a"/>
          <circle cx="73" cy="55" r="9" fill="url(#skinGrad)"/>

          <circle cx="125" cy="130" r="8" fill="url(#shirtGrad)"/>
          <path d="M 130 135 L 135 60 L 118 60 L 115 135 Z" fill="url(#shirtGrad)" filter="url(#shadow)"/>

        <!-- === WICKET ARM (Right arm Up with Finger) === -->
        <g id="arm-right-out" class="umpire-part">
          <circle cx="75" cy="130" r="8" fill="url(#shirtGrad)"/>
          <path d="M 70 135 L 65 60 L 82 60 L 85 135 Z" fill="url(#shirtGrad)" filter="url(#shadow)"/>
          <rect x="64" y="65" width="19" height="5" fill="#0f172a"/> <!-- Watch -->
          <circle cx="73" cy="55" r="9" fill="url(#skinGrad)"/>
          <rect x="71" y="32" width="5" height="22" fill="url(#skinGrad)" rx="2.5"/>
        </g>

        <!-- === WIDE ARMS (Both Horizontal) === -->
        <g id="arm-right-wide" class="umpire-part">
          <circle cx="75" cy="130" r="8" fill="url(#shirtGrad)"/>

          <rect x="22" y="125" width="5" height="15" fill="#0f172a"/> <!-- Watch -->
          <circle cx="12" cy="132" r="9" fill="url(#skinGrad)"/>

        <g id="arm-left-wide" class="umpire-part">
          <circle cx="125" cy="130" r="8" fill="url(#shirtGrad)"/>
          <path d="M 125 122 L 185 125 L 185 140 L 125 138 Z" fill="url(#shirtGrad)" filter="url(#shadow)"/>

        <!-- === NO BALL ARM (Right arm horizontal) === -->

          <circle cx="75" cy="130" r="8" fill="url(#shirtGrad)"/>

      </svg>
    </div>
    
    <!-- Scrolling Tournament Ticker -->
    <div class="ticker-wrapper">
      <div class="ticker-text">
        🏆 KCP CRICKET TOURNAMENT 2026 &nbsp;&nbsp;•&nbsp;&nbsp; LIVE MATCH IN PROGRESS &nbsp;&nbsp;•&nbsp;&nbsp; KCP CRICKET TOURNAMENT 2026 &nbsp;&nbsp;•&nbsp;&nbsp; EXCLUSIVE LIVE COVERAGE &nbsp;&nbsp;•&nbsp;&nbsp; 🏆 KCP CRICKET TOURNAMENT 2026
      </div>
    </div>
  </div>

  <script>
    let hideTimeout;

    function showSignal(type) {
      clearTimeout(hideTimeout);
      
      const overlay = document.getElementById('signalOverlay');
      const text = document.getElementById('signalText');
      const wrapper = document.getElementById('textWrapper');
      const umpire = document.getElementById('umpireContainer');
      const particles = document.getElementById('particles');

      // Reset classes
      overlay.className = 'signal-overlay active';
      umpire.className = 'umpire-container';
      
      // Reset arm opacities
      document.getElementById('arm-right-idle').style.opacity = '1';
      document.getElementById('arm-left-idle').style.opacity = '1';
      document.getElementById('arm-right-four').style.opacity = '0';
      document.getElementById('arm-right-six').style.opacity = '0';
      document.getElementById('arm-left-six').style.opacity = '0';
      document.getElementById('arm-right-out').style.opacity = '0';
      document.getElementById('arm-right-wide').style.opacity = '0';
      document.getElementById('arm-left-wide').style.opacity = '0';
      document.getElementById('arm-right-noball').style.opacity = '0';

      // Setup specific signal
      if (type === 'four') {
        overlay.classList.add('theme-four');
        umpire.classList.add('anim-four');
        text.innerText = 'FOUR';
        
        document.getElementById('arm-right-idle').style.opacity = '0';
        document.getElementById('arm-right-four').style.opacity = '1';
        
        // Celebrations!
        createFirework(20, 40, '#60a5fa');
        createFirework(80, 50, '#3b82f6');
        createConfetti(['#60a5fa', '#93c5fd', '#bfdbfe', '#ffffff']);
      } 
      else if (type === 'six') {
        overlay.classList.add('theme-six');
        umpire.classList.add('anim-six');
        text.innerText = 'SIX';

        document.getElementById('arm-right-idle').style.opacity = '0';
        document.getElementById('arm-left-idle').style.opacity = '0';
        document.getElementById('arm-right-six').style.opacity = '1';
        document.getElementById('arm-left-six').style.opacity = '1';
        
        // Massive Celebrations!
        setTimeout(() => createFirework(20, 30, '#10b981'), 0);
        setTimeout(() => createFirework(80, 30, '#f59e0b'), 300);
        setTimeout(() => createFirework(50, 20, '#3b82f6'), 600);
        createConfetti(['#34d399', '#fcd34d', '#f472b6', '#38bdf8', '#fbbf24', '#ffffff']);
      } 
      else if (type === 'out') {
        overlay.classList.add('theme-out');
        umpire.classList.add('anim-out');
        text.innerText = 'WICKET';

        document.getElementById('arm-right-idle').style.opacity = '0';
        document.getElementById('arm-right-out').style.opacity = '1';
        // Just the siren flash (CSS)
      }
      else if (type === 'wide') {
        overlay.classList.add('theme-wide');
        umpire.classList.add('anim-wide');
        text.innerText = 'WIDE';

        document.getElementById('arm-right-idle').style.opacity = '0';
        document.getElementById('arm-left-idle').style.opacity = '0';
        document.getElementById('arm-right-wide').style.opacity = '1';
        document.getElementById('arm-left-wide').style.opacity = '1';
      }
      else if (type === 'noball') {
        overlay.classList.add('theme-noball');
        umpire.classList.add('anim-noball');
        text.innerText = 'NO BALL';

        document.getElementById('arm-right-idle').style.opacity = '0';
        document.getElementById('arm-right-noball').style.opacity = '1';
      }

      // Hide after 4 seconds
      hideTimeout = setTimeout(() => {
        overlay.classList.remove('active');
        setTimeout(() => {
            particles.innerHTML = ''; // clear particles after fade
        }, 300);
      }, 4000);
    }

    function createFirework(x, y, color) {
      const container = document.getElementById('particles');
      
      for(let i=0; i<40; i++) {
        let p = document.createElement('div');
        p.style.position = 'absolute';
        p.style.width = '3px';
        p.style.height = '12px';
        p.style.background = color;
        p.style.borderRadius = '2px';
        p.style.left = x + '%';
        p.style.top = y + '%';
        p.style.boxShadow = `0 0 10px ${color}, 0 0 20px ${color}`;
        p.style.transformOrigin = 'center';
        
        let angle = Math.random() * Math.PI * 2;
        let distance = Math.random() * 120 + 30;
        let tx = Math.cos(angle) * distance;
        let ty = Math.sin(angle) * distance;
        let rot = angle + Math.PI/2;
        
        p.animate([
          { transform: `translate(0,0) rotate(${rot}rad) scale(1)`, opacity: 1 },
          { transform: `translate(${tx}px, ${ty}px) rotate(${rot}rad) scale(0)`, opacity: 0 }
        ], {
          duration: 800 + Math.random() * 600,
          easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
          fill: 'forwards'
        });
        
        container.appendChild(p);
      }
    }

    function createConfetti(colors) {
      const container = document.getElementById('particles');
      
      for (let i = 0; i < 250; i++) {
        let conf = document.createElement('div');
        conf.style.position = 'absolute';
        conf.style.width = (Math.random() * 8 + 4) + 'px';
        conf.style.height = (Math.random() * 12 + 6) + 'px';
        conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        conf.style.left = (Math.random() * 100) + '%';
        conf.style.top = '-10%';
        conf.style.opacity = '1';
        conf.style.borderRadius = (Math.random() > 0.5 ? '50%' : '0'); // Mix of circles and squares
        
        let duration = Math.random() * 2 + 2; 
        let delay = Math.random() * 0.5;
        let tx = (Math.random() - 0.5) * 300;
        
        conf.animate([
          { transform: `translate(0, 0) rotate(0deg) scale(1)`, opacity: 1 },
          { transform: `translate(${tx}px, 110vh) rotate(${Math.random() * 720}deg) scale(0.5)`, opacity: 0 }
        ], {
          duration: duration * 1000,
          delay: delay * 1000,
          easing: 'linear',
          fill: 'forwards'
        });
        
        container.appendChild(conf);
      }
    }
  </script>
