<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCP CREX HUB - Official Splash</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6ee7b7;
            --bg: #000000;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            color: white;
        }

        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Change to contain if you want to see the full video frame */
            animation: videoEntrance 1.5s ease-out;
        }

        @keyframes videoEntrance {
            from { opacity: 0; transform: scale(1.1); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Overlay Branding */
        .overlay {
            position: absolute;
            bottom: 60px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .brand-title {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
            opacity: 0;
            animation: fadeIn 1s ease forwards 2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cinematic Vignette */
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
            z-index: 5;
            pointer-events: none;
        }

    </style>
</head>
<body>

    <div class="video-container">
        <video id="splashVideo" src="splash_video.mp4" autoplay muted playsinline></video>
    </div>

    <div class="vignette"></div>

    <div class="overlay">
        <h1 class="brand-title">KCP CREX HUB</h1>
    </div>

    <script>
        const video = document.getElementById('splashVideo');
        
        // Loop the video for the demo
        video.onended = () => {
            video.currentTime = 0;
            video.play();
        };

        // You can add a redirect here if this was in the main app:
        /*
        video.onended = () => {
            window.location.href = 'index.html';
        };
        */
    </script>

</body>
</html>
