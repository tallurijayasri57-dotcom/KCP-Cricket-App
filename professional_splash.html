<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Cricket Hub - Splash</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6ee7b7;
            --bg: #030712;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            color: white;
        }

        .mesh-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(at 0% 0%, rgba(110, 231, 183, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 1) 0px, transparent 100%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1.5s ease-out;
        }

        .visual-stage {
            position: relative;
            width: 350px;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Static Premium Layout */
        .bat-box {
            position: absolute;
            width: 120px;
            height: 480px;
            transform: rotate(45deg) translateY(-20px);
            z-index: 20;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.6));
        }

        .ball-box {
            position: absolute;
            width: 80px;
            height: 80px;
            bottom: 60px;
            left: 100px;
            z-index: 25;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.8));
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Branding */
        .branding {
            text-align: center;
        }

        .brand-sub {
            font-size: 14px;
            letter-spacing: 12px;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        .brand-main {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to bottom, #fff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Subtle Glow Animation */
        .glow-pulse {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(110, 231, 183, 0.15) 0%, transparent 70%);
            z-index: 5;
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.4; transform: scale(1); }
            to { opacity: 0.8; transform: scale(1.3); }
        }

    </style>
</head>
<body>

    <div class="mesh-bg"></div>
    <div class="glow-pulse"></div>

    <div class="container">
        <div class="visual-stage">
            <div class="bat-box">
                <canvas id="batCanvas"></canvas>
            </div>

            <div class="ball-box">
                <canvas id="ballCanvas"></canvas>
            </div>
        </div>

        <div class="branding">
            <div class="brand-sub">THE NEXT GENERATION</div>
            <div class="brand-main">KCP CREX HUB</div>
        </div>
    </div>

    <script>
        function removeBackground(imgSrc, canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.src = imgSrc;
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i + 1], b = data[i + 2];
                    if (r < 45 && g < 45 && b < 45) { data[i + 3] = 0; }
                }
                ctx.putImageData(imgData, 0, 0);
            };
        }

        removeBackground('bat_clean.png', 'batCanvas');
        removeBackground('ball_clean.png', 'ballCanvas');
    </script>

</body>
</html>
