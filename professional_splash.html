<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCP CREX HUB - Professional Splash</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* ════════════════════════════════
           PHASE 1 (0s–3s): BAT + BALL
           Existing animation rescaled to
           fit 0%–50% of a 6s cycle
        ════════════════════════════════ */

        .bat-container, .ball-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bat-container {
            width: 160px;
            height: 640px;
            z-index: 20;
            animation: finalBat 6s infinite ease-out;
        }

        @keyframes finalBat {
            0%        { transform: translate(-800px, 800px) rotate(-45deg); opacity: 0; }
            10%       { opacity: 1; }
            22%       { transform: translate(-50%, -50%) rotate(-15deg); opacity: 1; }
            23%, 100% { opacity: 0; }
        }

        .ball-container {
            width: 70px;
            height: 70px;
            z-index: 25;
            animation: finalBall 6s infinite ease-out;
        }

        @keyframes finalBall {
            0%        { transform: translate(800px, -800px) scale(0.5); opacity: 0; }
            10%       { opacity: 1; }
            22%       { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            23%       { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            28%       { transform: translate(-50%, -50%) scale(30); opacity: 0; }
            100%      { opacity: 0; }
        }

        .flash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #fff 0%, rgba(110, 231, 183, 0.4) 50%, transparent 70%);
            border-radius: 50%;
            z-index: 30;
            opacity: 0;
            animation: finalFlash 6s infinite;
        }

        @keyframes finalFlash {
            0%, 21%   { opacity: 0; transform: translate(-50%, -50%) scale(0); }
            22%       { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
            25%       { opacity: 0; transform: translate(-50%, -50%) scale(3); }
            100%      { opacity: 0; }
        }

        .branding {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            z-index: 100;
            opacity: 0;
            animation: finalReveal 6s infinite;
        }

        .branding h1 {
            font-size: 86px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 7px;
            margin: 0;
            background: linear-gradient(to bottom, #fff 40%, #cbd5e1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 50px rgba(255,255,255,0.3);
        }

        @keyframes finalReveal {
            0%, 25%   { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
            30%, 47%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50%       { opacity: 0; }
            100%      { opacity: 0; }
        }

        /* ════════════════════════════════
           PHASE 2 (3s–6s): FOUNDER PHOTO
           Appears at 50%–100% of 6s cycle
        ════════════════════════════════ */

        /* Split white/navy background for founder phase */
        .founder-bg {
            position: absolute;
            inset: 0;
            z-index: 150;
            opacity: 0;
            animation: founderBgReveal 6s infinite;
            /* White top half, navy bottom half */
            background: linear-gradient(to bottom, #ffffff 50%, #1b2f5e 50%);
        }

        @keyframes founderBgReveal {
            0%, 50%   { opacity: 0; }
            55%       { opacity: 1; }
            95%       { opacity: 1; }
            100%      { opacity: 0; }
        }

        /* Oval portrait centred on the white/navy boundary */
        .founder-phase {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 160;
            opacity: 0;
            animation: founderReveal 6s infinite;
        }

        .founder-oval {
            width: 230px;
            height: 290px;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #fff;
            box-shadow:
                0 0 0 2px #c8d6e8,
                0 8px 40px rgba(0,0,0,0.35);
        }

        .founder-oval img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            filter: grayscale(100%) contrast(1.1);
        }

        @keyframes founderReveal {
            0%, 50%   { opacity: 0; transform: translate(-50%, -50%) scale(0.92); }
            56%       { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            93%       { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100%      { opacity: 0; transform: translate(-50%, -50%) scale(0.96); }
        }

        canvas { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div class="container">

        <!-- PHASE 1: Bat + Ball + Flash + Branding (0–3s) -->
        <div class="flash"></div>

        <div class="bat-container">
            <canvas id="batCanvas"></canvas>
        </div>

        <div class="ball-container">
            <canvas id="ballCanvas"></canvas>
        </div>

        <div class="branding">
            <h1>KCP CREX HUB</h1>
        </div>

        <!-- PHASE 2: Founder Photo (3–6s) -->
        <div class="founder-bg"></div>

        <div class="founder-phase">
            <div class="founder-oval">
                <img src="founder.png" alt="Founder">
            </div>
        </div>

    </div>

    <script>
        function removeBackground(imgSrc, canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.src = imgSrc;
            img.onload = () => {
                const scale = 4;
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i + 1], b = data[i + 2];
                    if (r < 60 && g < 60 && b < 60) { data[i + 3] = 0; }
                }
                ctx.putImageData(imgData, 0, 0);
            };
        }
        removeBackground('bat_hd.png', 'batCanvas');
        removeBackground('ball_sharp.png', 'ballCanvas');
    </script>

</body>
</html>
