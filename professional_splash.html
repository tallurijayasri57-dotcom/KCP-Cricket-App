<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCP CREX HUB - Professional Splash</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* GUARANTEED ALIGNMENT - BOTH CENTERED */
        .bat-container, .ball-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* HD BAT - 3s DURATION */
        .bat-container {
            width: 160px;
            height: 640px;
            z-index: 20;
            animation: finalBat 3s infinite ease-out;
        }

        @keyframes finalBat {
            0% { transform: translate(-800px, 800px) rotate(-45deg); opacity: 0; }
            20% { opacity: 1; }
            45% { transform: translate(-50%, -50%) rotate(-15deg); opacity: 1; }
            46%, 100% { opacity: 0; }
        }

        /* SHARP HD BALL - 3s DURATION */
        .ball-container {
            width: 70px;
            height: 70px;
            z-index: 25;
            animation: finalBall 3s infinite ease-out;
        }

        @keyframes finalBall {
            0% { transform: translate(800px, -800px) scale(0.5); opacity: 0; }
            20% { opacity: 1; }
            45% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            46% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            55% { transform: translate(-50%, -50%) scale(30); opacity: 0; } 
            100% { opacity: 0; }
        }

        .flash {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #fff 0%, rgba(110, 231, 183, 0.4) 50%, transparent 70%);
            border-radius: 50%;
            z-index: 30;
            opacity: 0;
            animation: finalFlash 3s infinite;
        }

        @keyframes finalFlash {
            0%, 44% { opacity: 0; transform: translate(-50%, -50%) scale(0); }
            45% { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
            50% { opacity: 0; transform: translate(-50%, -50%) scale(3); }
            100% { opacity: 0; }
        }

        /* BRANDING REVEAL */
        .branding {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            text-align: center;
            z-index: 100;
            opacity: 0;
            animation: finalReveal 3s infinite;
        }

        .branding h1 {
            font-size: 86px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 7px;
            margin: 0;
            background: linear-gradient(to bottom, #fff 40%, #cbd5e1 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 50px rgba(255,255,255,0.3);
        }

        @keyframes finalReveal {
            0%, 50% { opacity: 0; transform: translate(-50%, -50%) scale(0.85); }
            60%, 95% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; }
        }

        canvas { width: 100%; height: 100%; object-fit: contain; }

    </style>
</head>
<body>

    <div class="container">
        <div class="flash"></div>
        
        <div class="bat-container">
            <canvas id="batCanvas"></canvas>
        </div>

        <div class="ball-container">
            <canvas id="ballCanvas"></canvas>
        </div>

        <div class="branding">
            <h1>KCP CREX HUB</h1>
        </div>
    </div>

    <script>
        function removeBackground(imgSrc, canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.src = imgSrc;
            img.onload = () => {
                const scale = 4;
                canvas.width = img.width * scale;
                canvas.height = img.height * scale;
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i + 1], b = data[i + 2];
                    if (r < 60 && g < 60 && b < 60) { data[i + 3] = 0; }
                }
                ctx.putImageData(imgData, 0, 0);
            };
        }
        removeBackground('bat_hd.png', 'batCanvas');
        removeBackground('ball_sharp.png', 'ballCanvas');
    </script>

</body>
</html>
