<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Cricket Bounce Splash</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6ee7b7;
            --accent: #3b82f6;
            --bg: #030712;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            color: white;
        }

        .mesh-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(at 0% 0%, rgba(110, 231, 183, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 1) 0px, transparent 100%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .stage {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Horizontal Bat Position */
        .bat-box {
            position: absolute;
            width: 120px;
            height: 480px;
            bottom: -50px;
            transform-origin: 50% 10%;
            transform: rotate(70deg) translateZ(0); /* Tilted horizontally */
            z-index: 20;
            animation: batReact 2s infinite ease-in-out;
        }

        @keyframes batReact {
            0%, 100% { transform: rotate(70deg) translateY(0); }
            50% { transform: rotate(72deg) translateY(10px); } /* Bat dips on hit */
        }

        /* Bouncing Ball */
        .ball-box {
            position: absolute;
            width: 50px;
            height: 50px;
            z-index: 25;
            bottom: 250px;
            left: 200px;
            animation: ballBounce 2s infinite ease-in-out;
        }

        @keyframes ballBounce {
            0%, 100% { transform: translateY(0) scale(1, 1); } /* Top point */
            50% { transform: translateY(180px) scale(1.1, 0.9); } /* Hit point on bat - squish slightly */
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Branding Reveal */
        .branding {
            text-align: center;
            opacity: 0;
            animation: brandingReveal 2s infinite;
            margin-top: 20px;
        }

        .brand-sub {
            font-size: 14px;
            letter-spacing: 10px;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .brand-main {
            font-size: 58px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to bottom, #fff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes brandingReveal {
            0%, 40% { opacity: 0; transform: translateY(20px); }
            50%, 90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="mesh-bg"></div>

    <div class="container">
        <div class="stage">
            <div class="bat-box">
                <canvas id="batCanvas"></canvas>
            </div>

            <div class="ball-box">
                <canvas id="ballCanvas"></canvas>
            </div>
        </div>

        <div class="branding">
            <div class="brand-sub">PREMIUM CRICKET HUB</div>
            <div class="brand-main">KCP CREX HUB</div>
        </div>
    </div>

    <script>
        function removeBackground(imgSrc, canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.src = imgSrc;
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i + 1], b = data[i + 2];
                    if (r < 45 && g < 45 && b < 45) { data[i + 3] = 0; }
                }
                ctx.putImageData(imgData, 0, 0);
            };
        }

        removeBackground('bat_clean.png', 'batCanvas');
        removeBackground('ball_clean.png', 'ballCanvas');
    </script>

</body>
</html>
