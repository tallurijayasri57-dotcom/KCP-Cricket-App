<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KCP CREX HUB - Elite Splash</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6ee7b7;
            --bg: #030712;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            color: white;
        }

        .mesh-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(at 0% 0%, rgba(110, 231, 183, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 1) 0px, transparent 100%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        .action-stage {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
        }

        /* 100% Reliable Realistic Bat */
        .bat-box {
            position: absolute;
            width: 100px;
            height: 400px;
            left: 45%;
            bottom: 5%;
            transform-origin: 50% 10%;
            transform: rotateX(20deg) rotateY(-110deg);
            z-index: 20;
            animation: eliteActionSwing 4s infinite cubic-bezier(0.45, 0, 0.05, 1);
        }

        /* 100% Reliable Realistic Ball */
        .ball-box {
            position: absolute;
            width: 65px;
            height: 65px;
            z-index: 25;
            opacity: 0;
            animation: eliteActionBall 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        canvas { width: 100%; height: 100%; object-fit: contain; }

        @keyframes eliteActionSwing {
            0%, 40% { transform: rotateX(20deg) rotateY(-110deg); opacity: 0; }
            42% { opacity: 1; }
            50% { transform: rotateX(0deg) rotateY(20deg) translateZ(100px); }
            60% { transform: rotateX(-10deg) rotateY(40deg) translateZ(150px); }
            85%, 100% { opacity: 0; }
        }

        @keyframes eliteActionBall {
            0% { transform: translate(500px, 150px) scale(0.2); opacity: 0; }
            10% { opacity: 1; }
            48% { transform: translate(20px, 10px) scale(1); opacity: 1; }
            50% { transform: translate(0, 0) scale(1.3); opacity: 1; }
            55% { transform: translate(-200px, -400px) scale(8); opacity: 0; }
            100% { opacity: 0; }
        }

        /* Impact Flash */
        .flash {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #fff 0%, var(--primary) 40%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            z-index: 30;
            animation: flashTrigger 4s infinite;
        }

        @keyframes flashTrigger {
            0%, 49% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1.5); }
            55% { opacity: 0; transform: scale(3); }
            100% { opacity: 0; }
        }

        /* Branding Reveal */
        .branding {
            text-align: center;
            margin-top: -60px;
            opacity: 0;
            animation: brandingShow 4s infinite;
        }

        .branding h1 {
            font-size: 64px;
            font-weight: 800;
            letter-spacing: 5px;
            background: linear-gradient(to bottom, #fff 40%, #64748b 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes brandingShow {
            0%, 55% { opacity: 0; transform: translateY(30px); }
            70%, 90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; }
        }

    </style>
</head>
<body>

    <div class="mesh-bg"></div>

    <div class="container">
        <div class="action-stage">
            <div class="flash"></div>
            
            <div class="bat-box">
                <canvas id="batCanvas"></canvas>
            </div>

            <div class="ball-box">
                <canvas id="ballCanvas"></canvas>
            </div>
        </div>

        <div class="branding">
            <h1>KCP CREX HUB</h1>
        </div>
    </div>

    <script>
        function removeBackground(imgSrc, canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.src = imgSrc;
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i], g = data[i + 1], b = data[i + 2];
                    if (r < 50 && g < 50 && b < 50) { data[i + 3] = 0; }
                }
                ctx.putImageData(imgData, 0, 0);
            };
        }
        removeBackground('bat_clean.png', 'batCanvas');
        removeBackground('ball_clean.png', 'ballCanvas');
    </script>

</body>
</html>
