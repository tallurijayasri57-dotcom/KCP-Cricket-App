<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Cricket Splash</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6ee7b7;
            --accent: #3b82f6;
            --bg: #030712;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            color: white;
        }

        .mesh-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(at 0% 0%, rgba(110, 231, 183, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 1) 0px, transparent 100%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .stage {
            position: relative;
            width: 400px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .bat-box {
            position: absolute;
            width: 80px;
            height: 320px;
            bottom: 10%;
            left: 40%;
            transform-origin: 50% 10%;
            transform: rotate(-115deg) translateZ(50px);
            z-index: 20;
            animation: eliteSwing 3.5s infinite cubic-bezier(0.45, 0, 0.05, 1);
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @keyframes eliteSwing {
            0%, 35% { transform: rotate(-115deg) translateZ(50px); opacity: 1; }
            45% { transform: rotate(20deg) translateZ(80px); }
            55% { transform: rotate(35deg) translateZ(100px); }
            80%, 100% { transform: rotate(35deg) translateZ(100px); opacity: 0; }
        }

        .ball-box {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 25;
            opacity: 0;
            animation: eliteBall 3.5s infinite cubic-bezier(0.45, 0, 0.05, 1);
        }

        @keyframes eliteBall {
            0% { transform: translate(500px, 150px) scale(0.3); opacity: 0; }
            10% { opacity: 1; }
            45% { transform: translate(0, 0) scale(1); opacity: 1; }
            55% { transform: translate(-400px, -600px) scale(8); opacity: 0; }
            100% { opacity: 0; }
        }

        .shockwave {
            position: absolute;
            width: 2px;
            height: 2px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            opacity: 0;
            z-index: 15;
            animation: shock 3.5s infinite;
        }

        @keyframes shock {
            0%, 44% { opacity: 0; transform: scale(0); }
            45% { opacity: 1; transform: scale(1); }
            55% { opacity: 0; transform: scale(300); }
            100% { opacity: 0; }
        }

        .branding {
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            animation: brandingElite 3.5s infinite;
            margin-top: -40px;
        }

        .brand-sub {
            font-size: 14px;
            letter-spacing: 10px;
            color: var(--primary);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .brand-main {
            font-size: 58px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to bottom, #fff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes brandingElite {
            0%, 55% { opacity: 0; transform: translateY(30px) scale(0.9); }
            65%, 90% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: scale(1.1); }
        }

    </style>
</head>
<body>

    <div class="mesh-bg"></div>

    <div class="container">
        <div class="stage">
            <div class="shockwave"></div>
            
            <div class="bat-box">
                <canvas id="batCanvas"></canvas>
            </div>

            <div class="ball-box">
                <canvas id="ballCanvas"></canvas>
            </div>
        </div>

        <div class="branding">
            <div class="brand-sub">PREMIUM CRICKET EXPERIENCE</div>
            <div class="brand-main">KCP CREX HUB</div>
        </div>
    </div>

    <script>
        function removeBackground(imgSrc, canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.src = imgSrc;
            img.onload = () => {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                
                // Color to remove (Black/White depending on asset)
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    
                    // Remove very dark colors (the black background)
                    if (r < 40 && g < 40 && b < 40) {
                        data[i + 3] = 0; // Set alpha to 0
                    }
                }
                ctx.putImageData(imgData, 0, 0);
            };
        }

        // Apply background removal to our new clean assets
        removeBackground('bat_clean.png', 'batCanvas');
        removeBackground('ball_clean.png', 'ballCanvas');
    </script>

</body>
</html>
